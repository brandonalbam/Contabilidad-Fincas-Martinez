<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier &amp; Co, alta joyería colombiana</title>
<meta name="description" content="Atelier & Co: joyería de alta calidad, hecha a mano en Colombia. Esmeraldas colombianas y oro de 18 quilates. Personaliza tu joya y conoce su precio al instante.">
<meta name="theme-color" content="#ECEBE3">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" sizes="48x48" href="atelier-favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="atelier-icono-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="atelier-apple-touch.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
/* ===== Atelier & Co — catálogo "Nácar" =====
   Lenguaje: nácar y esmeralda; la talla esmeralda (rectángulo con esquinas cortadas) es la forma de botones y opciones;
   las vitrinas tienen arco; las tallas son anillos. Las secuencias de scroll son el único gesto grande. */
:root{
  --serif:'Gloock', 'Didot', 'Bodoni 72', Georgia, serif;
  --sans:'Instrument Sans', 'Helvetica Neue', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --nacar:#ECEBE3; --papel:#F7F6F1; --tinta:#13261F; --tinta2:#4D5B54; --esmeralda:#0B5A43; --esmeralda2:#0E6B50;
  --noche:#0C2B23; --noche2:#123A2F; --oro:#A98234; --oro-txt:#7D5C1B; --oro-claro:#D9B26A;
  --linea:rgba(19,38,31,.16); --linea2:rgba(19,38,31,.28);
  --fondo:var(--nacar); --superficie:var(--papel); --acento:var(--esmeralda); --vidrio:rgba(236,235,227,.82); --sombra:rgba(19,38,31,.22);
  --t-cuerpo:16.5px; --t-ui:15px; --t-meta:14px; --t-etq:13px;
  --bisel:9px; --ancho:1260px;
  --curva:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:var(--t-cuerpo);line-height:1.6;color:var(--tinta);background:var(--fondo);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'kern','liga','tnum' 0}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--esmeralda);outline-offset:3px}
[hidden]{display:none!important}
.envol{max-width:var(--ancho);margin:0 auto;padding:0 clamp(18px,5vw,64px)}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.02;margin:0;letter-spacing:-.012em;text-wrap:balance}
.estado{padding:140px 20px;text-align:center;color:var(--tinta2)}
[data-rev]{opacity:1}
.ceja{font-size:var(--t-meta);color:var(--tinta2);margin:0}

/* ---------- Botones: talla esmeralda ---------- */
.btn-oro,.btn-linea{--c:var(--bisel);position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;text-decoration:none;font-weight:600;font-size:var(--t-ui);letter-spacing:.005em;cursor:pointer;border:0;white-space:nowrap;
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c));transition:background-color .3s,color .3s}
.btn-oro{background:var(--esmeralda);color:var(--nacar)}
.btn-oro::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,236,190,.38) 50%,transparent 65%) 160% 0/250% 100% no-repeat;z-index:-1;transition:background-position .9s var(--curva)}
.btn-oro:hover{background:var(--esmeralda2)}
.btn-oro:hover::after{background-position:-60% 0}
.btn-linea{background:var(--linea2);color:var(--tinta)}
.btn-linea::before{content:'';position:absolute;inset:1.5px;z-index:-1;background:var(--fondo);clip-path:polygon(calc(var(--c) - .6px) 0,calc(100% - var(--c) + .6px) 0,100% calc(var(--c) - .6px),100% calc(100% - var(--c) + .6px),calc(100% - var(--c) + .6px) 100%,calc(var(--c) - .6px) 100%,0 calc(100% - var(--c) + .6px),0 calc(var(--c) - .6px));transition:background-color .3s}
.btn-linea:hover{background:var(--tinta)}
.btn-oro:focus-visible,.btn-linea:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--oro-claro)}
.btn-oro svg,.btn-linea svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.btn-oro svg[fill=currentColor]{fill:currentColor;stroke:none}
.btn-linea.sobre-noche{background:rgba(236,235,227,.4);color:var(--nacar)}.btn-linea.sobre-noche::before{background:var(--noche)}.btn-linea.sobre-noche:hover{background:var(--nacar)}
.enlace{color:var(--esmeralda);font-weight:600;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat;padding-bottom:2px;transition:background-size .35s var(--curva)}
.enlace:hover{background-size:0 1px;background-position:100% 100%}

/* ---------- Barra superior ---------- */
.top{position:fixed;inset:0 0 auto 0;z-index:40;transition:background-color .35s,box-shadow .35s,transform .45s var(--curva)}
.top .envol{display:flex;align-items:center;gap:22px;height:72px}
.top.solida{background:var(--vidrio);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 1px 0 var(--linea)}
.top.sobre-noche:not(.solida){color:var(--nacar)}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto;color:inherit}
.logo svg,.logo .logo-svg svg{width:26px;height:auto;display:block}
.logo .logo-svg{width:26px}
.logo span:last-child{font-family:var(--serif);font-size:20px;letter-spacing:.06em;white-space:nowrap}
.logo small{font-family:var(--sans);font-size:.62em;font-weight:500;margin:0 .14em;vertical-align:.18em}
.top nav{display:flex;gap:4px}
.top nav a{position:relative;text-decoration:none;font-size:var(--t-ui);font-weight:500;padding:10px 14px;color:inherit;opacity:.78;transition:opacity .2s}
.top nav a::after{content:'';position:absolute;left:14px;right:14px;bottom:4px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .4s var(--curva)}
.top nav a:hover,.top nav a.activo{opacity:1}
.top nav a:hover::after,.top nav a.activo::after{transform:scaleX(1)}
.btn-perfil{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:var(--t-ui);font-weight:500;padding:10px 6px;white-space:nowrap}
.btn-perfil svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.btn-perfil.con-perfil svg{stroke:var(--esmeralda)}
.btn-perfil:focus-visible,.btn-menu:focus-visible{outline:2px solid var(--esmeralda);outline-offset:3px}
.top .btn-oro{min-height:42px;padding:0 18px;--c:7px}
.btn-menu{all:unset;cursor:pointer;display:none;align-items:center;gap:9px;font-size:var(--t-ui);font-weight:600;padding:8px 2px}
.btn-menu .gema-menu{width:22px;height:22px;transition:transform .6s var(--curva)}
.btn-menu[aria-expanded=true] .gema-menu{transform:rotate(135deg)}
.gema-menu path{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}

/* menú: se abre desde el botón como un aro que crece */
.menu-movil{position:fixed;inset:0;z-index:90;background:var(--noche);color:var(--nacar);display:flex;flex-direction:column;padding:16px clamp(18px,5vw,64px) calc(24px + env(safe-area-inset-bottom));clip-path:circle(0 at calc(100% - 44px) 36px);transition:clip-path .7s cubic-bezier(.7,0,.2,1)}
.menu-movil.abierto{clip-path:circle(150% at calc(100% - 44px) 36px)}
.mm-cab{display:flex;justify-content:space-between;align-items:center;height:56px}
.mm-logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;letter-spacing:.06em}.mm-logo small{font-family:var(--sans);font-size:.62em;margin:0 .14em}
.mm-logo .logo-svg{width:24px;display:block}.mm-logo .logo-svg svg{width:100%;height:auto;display:block}
.mm-cerrar{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:var(--t-ui);font-weight:600}
.mm-cerrar::after{content:'';width:20px;height:20px;background:linear-gradient(45deg,transparent 46%,currentColor 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,currentColor 46% 54%,transparent 54%)}
.mm-nav{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;counter-reset:mm}
.mm-nav a{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 18px;padding:10px 0;text-decoration:none;color:inherit;opacity:0;transform:translateY(24px);transition:opacity .5s calc(.06s * var(--i) + .25s),transform .7s var(--curva) calc(.06s * var(--i) + .25s)}
.menu-movil.abierto .mm-nav a{opacity:1;transform:none}
.mm-nav span{font-family:var(--serif);font-size:clamp(40px,11vw,96px);line-height:1;letter-spacing:-.02em;transition:color .3s}
.mm-nav a:hover span{color:var(--oro-claro)}
.mm-nav i{font-style:normal;font-size:var(--t-meta);color:rgba(236,235,227,.6)}
.mm-pie{display:flex;gap:12px}.mm-pie > *{flex:1}
.mm-pie .btn-linea{background:rgba(236,235,227,.4);color:var(--nacar)}.mm-pie .btn-linea::before{background:var(--noche)}
.mm-pie .btn-oro{background:var(--nacar);color:var(--noche)}

/* ---------- Secuencias de scroll ---------- */
.seq{position:relative;height:var(--alto,300vh)}
.seq-fijo{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid}
.seq-lienzo{position:absolute;display:block;pointer-events:none}
.seq.sin-cuadros{height:auto}.seq.sin-cuadros .seq-fijo{position:relative;height:auto;min-height:80vh;padding:120px 0 80px}
.seq-textos{position:relative;z-index:2;pointer-events:none}
.seq-textos a,.seq-textos button{pointer-events:auto}
.seq-paso{position:absolute;opacity:0;will-change:opacity,transform}
.seq-paso h1,.seq-paso h2{font-size:clamp(44px,6.4vw,104px)}
.seq-paso p{font-size:clamp(17px,1.5vw,21px);line-height:1.45;max-width:30ch;margin:18px 0 0;color:var(--tinta2)}
.seq-paso .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
/* el aro de avance: se llena con el scroll */
.aro-avance{position:absolute;z-index:3;width:46px;height:46px;right:clamp(18px,4vw,56px);bottom:clamp(20px,4vh,44px)}
.aro-avance circle{fill:none;stroke-width:1.5}
.aro-avance .base{stroke:var(--linea2)}
.aro-avance .lleno{stroke:var(--oro);stroke-dasharray:1;stroke-dashoffset:calc(1 - var(--p,0));transform:rotate(-90deg);transform-origin:center}
.aro-avance .piedra{fill:var(--esmeralda);transform-origin:center;transform:rotate(calc(var(--p,0) * 360deg)) translateY(-19px)}

/* 1. Portada: el anillo */
#inicio{background:var(--nacar)}
#inicio .seq-lienzo{right:max(0px,calc(50vw - 700px));top:53%;width:min(90vh,60vw);height:min(90vh,60vw);transform:translateY(-50%)}
#inicio .seq-textos{max-width:var(--ancho);width:100%;margin:0 auto;padding:0 clamp(18px,5vw,64px)}
#inicio .seq-paso{left:clamp(18px,5vw,64px);top:50%;transform:translateY(-50%);max-width:min(40vw,560px)}
#inicio .seq-paso.p0 h1{font-size:clamp(52px,7.4vw,124px)}
#inicio .seq-paso h2{font-size:clamp(36px,4.6vw,76px)}
#inicio .bajar{position:absolute;left:clamp(18px,5vw,64px);bottom:clamp(22px,4vh,44px);font-size:var(--t-meta);color:var(--tinta2);display:flex;align-items:center;gap:12px;z-index:3;text-decoration:none}
#inicio .bajar i{width:44px;height:1px;background:var(--tinta2);transform-origin:left;animation:linea 2.4s var(--curva) infinite}
@keyframes linea{0%{transform:scaleX(0)}50%{transform:scaleX(1);transform-origin:left}51%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}

/* 2. Piedras */
#piedras{background:var(--papel)}
#piedras .seq-lienzo{left:50%;top:50%;width:min(96vh,58vw);height:min(96vh,58vw);transform:translate(-8%,-50%)}
#piedras .seq-textos{max-width:var(--ancho);width:100%;margin:0 auto;padding:0 clamp(18px,5vw,64px);display:flex;flex-direction:column;justify-content:center}
#piedras h2{font-size:clamp(38px,5vw,78px);max-width:10ch}
#piedras .intro{max-width:32ch;color:var(--tinta2);font-size:clamp(16px,1.4vw,19px);line-height:1.5;margin:18px 0 34px}
.lista-piedras{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lista-piedras li{display:flex;align-items:center;gap:16px;font-family:var(--serif);font-size:clamp(28px,3.4vw,48px);line-height:1.08;color:var(--tinta);opacity:.22;transform:translateX(0);transition:opacity .45s,transform .6s var(--curva)}
.lista-piedras li.activa{opacity:1;transform:translateX(10px)}
.lista-piedras .faceta{width:.62em;height:.62em;flex:none}
#piedras .nota-p{margin-top:30px;font-size:var(--t-meta);color:var(--tinta2);pointer-events:auto}

/* 3. Collar */
#collar{background:var(--noche);color:var(--nacar)}
#collar .seq-lienzo{left:58%;top:50%;width:min(100vh,100vw);height:min(100vh,100vw);transform:translate(-50%,-50%)}
#collar .seq-textos{max-width:var(--ancho);width:100%;margin:0 auto;padding:0 clamp(18px,5vw,64px)}
#collar .seq-paso{left:clamp(18px,5vw,64px);right:auto;top:clamp(110px,16vh,170px);max-width:min(30vw,420px);text-align:left}
#collar .seq-paso h2{font-size:clamp(38px,4.4vw,72px);color:var(--nacar);max-width:9ch;margin:0}
#collar .seq-paso p{color:rgba(236,235,227,.74);margin:16px auto 0}
#collar .seq-paso.abajo{top:auto;bottom:clamp(40px,8vh,90px);left:clamp(18px,5vw,64px);right:auto;max-width:300px;text-align:left}
#collar .seq-paso.abajo p{margin:0}
#collar .seq-paso.abajo .cta{justify-content:flex-start}
#collar .seq-paso .cta{justify-content:center}
#collar .aro-avance .base{stroke:rgba(236,235,227,.25)}#collar .aro-avance .piedra{fill:var(--oro-claro)}

/* ---------- Secciones ---------- */
.bloque{padding:clamp(90px,12vw,170px) 0;position:relative}
.cab-sec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr);gap:24px 60px;align-items:end;margin-bottom:clamp(36px,5vw,64px)}
.cab-sec h2{font-size:clamp(42px,6vw,96px)}
.cab-sec p{margin:0;color:var(--tinta2);max-width:38ch;font-size:clamp(16px,1.3vw,18px)}

/* Pieza destacada (3D que se puede girar) */
.destacada{background:var(--nacar);padding:clamp(80px,10vw,150px) 0}
.destacada .envol{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(30px,6vw,90px);align-items:center}
.destacada h2{font-size:clamp(36px,4.6vw,72px);margin-bottom:16px}
.destacada .txt p{color:var(--tinta2);max-width:36ch;margin:0 0 28px}
.vh{position:relative;width:100%;display:grid;gap:0}
.vh-escena{position:relative;width:100%;aspect-ratio:1}
.vh-visor{position:absolute;inset:0;overflow:hidden;border-radius:50% 50% 0 0/38% 38% 0 0;background:radial-gradient(100% 80% at 50% 30%,#FFFFFF,var(--papel) 60%,#E3E2D9)}
.vh-visor img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s var(--curva)}
.vh-visor .sin{position:absolute;inset:0;display:grid;place-items:center}.vh-visor .sin svg{width:30%;opacity:.4}
.vh-3d{position:absolute;inset:0;opacity:0;transition:opacity .9s var(--curva)}
.vh-visor.con-3d img{opacity:0}.vh-visor.con-3d .vh-3d{opacity:1}
.vh-pista{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:2;white-space:nowrap;font-size:var(--t-etq);color:var(--tinta2);pointer-events:none;transition:opacity .6s;display:flex;align-items:center;gap:8px}
.vh-pista::before{content:'';width:26px;height:10px;border:1.5px solid currentColor;border-radius:50%;border-top-color:transparent}
.vh-pista.fuera{opacity:0}
.vh-pista.boton{pointer-events:auto;cursor:pointer;color:var(--tinta);font-weight:600}
.vh-panel{position:relative;padding:22px 0 0;border-top:1px solid var(--linea2)}
.vh-nombre{font-family:var(--serif);font-size:clamp(22px,2vw,28px);margin:0 0 12px}
.vh-pie{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;flex-wrap:wrap}
.vh-precio{margin:0;font-size:var(--t-meta);color:var(--tinta2)}
.vh-precio b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(28px,2.6vw,36px);color:var(--tinta);font-variant-numeric:lining-nums tabular-nums;line-height:1.1}

/* ---------- Opciones (piedra, oro, talla) ---------- */
.c3-fila{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:start;gap:10px;margin:10px 0}
.c3-fila > span{font-size:var(--t-meta);color:var(--tinta2);padding-top:10px}
.c3-ops{display:flex;flex-wrap:wrap;gap:6px}
.opc{position:relative;max-width:100%}
.opc input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;z-index:2}
.opc > span{--c:6px;position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:8px;padding:9px 13px;font-size:var(--t-meta);line-height:1.25;background:var(--linea2);color:var(--tinta);
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c));transition:background-color .25s,color .25s}
.opc > span::before{content:'';position:absolute;inset:1px;z-index:-1;background:var(--papel);clip-path:polygon(calc(var(--c) - .4px) 0,calc(100% - var(--c) + .4px) 0,100% calc(var(--c) - .4px),100% calc(100% - var(--c) + .4px),calc(100% - var(--c) + .4px) 100%,calc(var(--c) - .4px) 100%,0 calc(100% - var(--c) + .4px),0 calc(var(--c) - .4px));transition:background-color .25s}
.opc:hover > span{background:var(--tinta)}
.opc input:checked + span{background:var(--tinta);color:var(--nacar)}
.opc input:checked + span::before{background:var(--tinta)}
.opc input:focus-visible + span{background:var(--esmeralda)}
.opc input:focus-visible + span::before{inset:2.5px}
.opc small{color:var(--tinta2);font-size:var(--t-etq);margin-left:2px}
.opc input:checked + span small{color:rgba(236,235,227,.7)}
/* tallas: cada una es un anillo */
.f-c3talla .c3-ops{gap:6px}
.f-c3talla .opc > span{clip-path:none;background:none;width:44px;height:44px;padding:0;justify-content:center;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--linea2);font-variant-numeric:tabular-nums}
.f-c3talla .opc > span::before{display:none}
.f-c3talla .opc:hover > span{box-shadow:inset 0 0 0 1.5px var(--tinta)}
.f-c3talla .opc input:checked + span{background:var(--esmeralda);color:var(--nacar);box-shadow:inset 0 0 0 1.5px var(--esmeralda),0 0 0 3px var(--papel),0 0 0 4.5px var(--oro)}
.f-c3talla .opc input:focus-visible + span{box-shadow:inset 0 0 0 3px var(--esmeralda)}
.f-c3talla .opc:last-child > span{width:auto;border-radius:22px;padding:0 16px}
/* piedra: gema facetada vista desde arriba */
.muestra-piedra,.faceta{display:inline-block;width:16px;height:16px;flex:none;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);position:relative;vertical-align:-3px}
.muestra-piedra::after,.faceta::after{content:'';position:absolute;inset:0;background:conic-gradient(from 22.5deg,rgba(255,255,255,.45) 0 12.5%,rgba(0,0,0,.18) 0 25%,rgba(255,255,255,.25) 0 37.5%,rgba(0,0,0,.28) 0 50%,rgba(255,255,255,.4) 0 62.5%,rgba(0,0,0,.15) 0 75%,rgba(255,255,255,.3) 0 87.5%,rgba(0,0,0,.24) 0);mix-blend-mode:soft-light}
.muestra-piedra::before,.faceta::before{content:'';position:absolute;inset:28%;background:rgba(255,255,255,.35);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);z-index:1}
/* oro: lingote */
.muestra-oro{display:inline-block;width:20px;height:11px;flex:none;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);vertical-align:-1px}

/* ---------- Colección ---------- */
.coleccion{background:var(--nacar)}
.titular-desliza{overflow:hidden;white-space:nowrap;margin-bottom:clamp(30px,4vw,56px)}
.titular-desliza span{display:inline-block;font-family:var(--serif);font-size:clamp(72px,15vw,240px);line-height:.9;letter-spacing:-.03em;will-change:transform}
.titular-desliza em{font-style:normal;color:transparent;-webkit-text-stroke:1.2px var(--tinta);margin-left:.3em}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:clamp(30px,4vw,48px)}
.filtros button{--c:6px;position:relative;isolation:isolate;border:0;padding:10px 15px;cursor:pointer;font-size:var(--t-meta);font-weight:500;background:var(--linea2);color:var(--tinta);
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.filtros button::before{content:'';position:absolute;inset:1px;z-index:-1;background:var(--nacar);clip-path:inherit}
.filtros button b{font-weight:500;color:var(--tinta2);margin-left:6px}
.filtros button[aria-pressed=true]{background:var(--tinta);color:var(--nacar)}
.filtros button[aria-pressed=true]::before{background:var(--tinta)}
.filtros button[aria-pressed=true] b{color:rgba(236,235,227,.7)}
.filtros button:focus-visible{outline:none;background:var(--esmeralda)}
.mosaico{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:dense;gap:clamp(40px,5vw,72px) clamp(16px,2.4vw,34px);align-items:start}
.pieza{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.pieza:focus-visible{outline:none}.pieza:focus-visible .foto{box-shadow:0 0 0 3px var(--nacar),0 0 0 5px var(--esmeralda)}
.pieza .foto{position:relative;overflow:hidden;aspect-ratio:4/5;background:var(--papel);border-radius:50% 50% 0 0/30% 30% 0 0;isolation:isolate}
.pieza .foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--curva),opacity .7s ease}
.pieza .foto img.alt{opacity:0}
.pieza .foto .sin{position:absolute;inset:0;display:grid;place-items:center}.pieza .foto .sin svg{width:28%;opacity:.35}
.pieza .info{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:18px 2px 0;border-top:1px solid var(--linea2);margin-top:14px}
.pieza h3{font-size:clamp(20px,1.7vw,26px);line-height:1.15}
.pieza .precio{grid-column:1;margin:0;font-size:var(--t-meta);color:var(--tinta2);font-variant-numeric:tabular-nums}
.pieza .precio b{color:var(--tinta);font-weight:600}
.gemas{grid-column:2;grid-row:1/span 2;display:flex;gap:4px;align-items:center;align-self:center}
.gemas i{width:12px;height:12px;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.gemas small{font-size:var(--t-etq);color:var(--tinta2);margin-left:2px}
.marca-3d{position:absolute;top:18%;left:50%;transform:translateX(-50%);z-index:2;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;background:rgba(247,246,241,.85);color:var(--tinta);font-size:var(--t-etq);font-weight:600;border-radius:20px;backdrop-filter:blur(6px)}
.marca-3d svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.pieza .ver{position:absolute;left:50%;bottom:16px;z-index:2;transform:translate(-50%,10px);display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:var(--tinta);color:var(--nacar);font-size:var(--t-meta);font-weight:600;opacity:0;transition:opacity .45s var(--curva),transform .45s var(--curva);white-space:nowrap;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.pieza .ver svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
@media (hover:hover){.pieza:hover .foto img{transform:scale(1.05)}.pieza:hover .foto img.alt{opacity:1}.pieza:hover .ver,.pieza:focus-visible .ver{opacity:1;transform:translate(-50%,0)}}
.pieza.f-estudio .foto{background:radial-gradient(100% 80% at 50% 30%,#FFFFFF,var(--papel) 60%,#E5E4DB)}
.pieza.f-estudio .foto img{object-fit:contain;padding:12%}
.pieza.f-amplia{grid-column:span 2}
.pieza.f-amplia .foto{aspect-ratio:1.5;border-radius:50% 50% 0 0/42% 42% 0 0}
.pieza.f-amplia h3{font-size:clamp(24px,2.3vw,34px)}

/* ---------- Diseña tu joya ---------- */
.personalizar{position:relative;padding:clamp(90px,11vw,160px) 0;background:var(--papel)}
.personalizar .envol{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(34px,6vw,90px);align-items:start}
.personalizar .envol > div:first-child{position:sticky;top:110px}
.personalizar h2{font-size:clamp(42px,5.4vw,86px)}
.personalizar .intro{color:var(--tinta2);font-size:clamp(16px,1.3vw,18.5px);margin:20px 0 34px;max-width:34ch}
.tres-pasos{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--linea2);counter-reset:paso}
.tres-pasos li{display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--linea2)}
.tres-pasos .ilus{width:52px}
.tres-pasos b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.1}
.tres-pasos span{font-size:var(--t-meta);color:var(--tinta2)}
.derecha-diseno{position:relative;min-width:0}
.teaser{position:relative;background:var(--noche);color:var(--nacar);padding:clamp(28px,4vw,48px);transition:opacity .35s ease,transform .45s var(--curva);
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px)}
.teaser h3{font-size:clamp(30px,3vw,44px);margin-bottom:12px}
.pide{margin:0 0 28px;color:rgba(236,235,227,.75);max-width:34ch}
.pide span{color:var(--nacar)}
.abrir-diseno{width:100%;min-height:58px;font-size:16px}
.teaser .btn-oro{background:var(--nacar);color:var(--noche)}
.teaser .btn-oro:hover{background:#fff}
.abrir-diseno svg{width:20px;height:20px;transition:transform .4s}
.abrir-diseno:hover svg{transform:rotate(90deg)}
.teaser .nota-t{color:rgba(236,235,227,.62);font-size:var(--t-meta);margin:14px 0 0;text-align:center}
.teaser.oculto{opacity:0;transform:translateY(-12px);pointer-events:none;position:absolute;inset:0 0 auto 0}
.plegable{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .7s var(--curva),opacity .5s ease .1s}
.plegable > div{overflow:hidden;min-height:0}
.plegable.abierto{grid-template-rows:1fr;opacity:1}
.plegable.abierto > div{overflow:visible}
.form-diseno{position:relative;background:var(--nacar);padding:clamp(22px,3.4vw,40px);box-shadow:inset 0 0 0 1px var(--linea)}
.form-diseno h3{font-size:clamp(28px,2.6vw,38px);margin-bottom:6px}
.form-diseno .sub{color:var(--tinta2);margin:0 0 26px;font-size:var(--t-ui)}
.cerrar-diseno{all:unset;cursor:pointer;position:absolute;top:18px;right:18px;width:40px;height:40px;display:grid;place-items:center;font-size:26px;line-height:1;color:var(--tinta2);z-index:2}
.cerrar-diseno:hover{color:var(--tinta)}
.cerrar-diseno:focus-visible{outline:2px solid var(--esmeralda)}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:22px 18px}
.campos > *,.personalizar .envol > *,.form-diseno{min-width:0}
.campo{display:flex;flex-direction:column;gap:4px;font-size:var(--t-meta);font-weight:500;color:var(--tinta2)}
.campo.ancho{grid-column:1/-1}
.campo input,.campo select,.campo textarea{font-size:16px;font-weight:400;background:transparent;border:0;border-bottom:1.5px solid var(--linea2);border-radius:0;padding:9px 0;color:var(--tinta);width:100%;transition:border-color .25s}
.campo select{appearance:none;-webkit-appearance:none;background:linear-gradient(45deg,transparent 50%,var(--tinta) 50%) calc(100% - 9px) 55%/6px 6px no-repeat,linear-gradient(-45deg,transparent 50%,var(--tinta) 50%) calc(100% - 3px) 55%/6px 6px no-repeat;padding-right:24px}
.campo textarea{resize:vertical;min-height:100px;line-height:1.5;border:1.5px solid var(--linea2);padding:12px}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--esmeralda)}
.campo small{font-weight:400;font-size:var(--t-etq);color:var(--tinta2)}
.presu{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.presu label{position:relative}
.presu input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:2}
.presu span{--c:6px;display:block;font-size:var(--t-meta);font-weight:400;padding:9px 13px;color:var(--tinta);background:var(--papel);box-shadow:inset 0 0 0 1px var(--linea2);transition:background-color .2s,color .2s}
.presu input:checked + span{background:var(--tinta);color:var(--nacar);box-shadow:none}
.presu input:focus-visible + span{outline:2px solid var(--esmeralda);outline-offset:2px}
.taller{grid-column:1/-1;min-width:0;padding:16px;background:var(--papel);box-shadow:inset 0 0 0 1px var(--linea)}
.taller-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.taller-cab b{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--tinta)}
.taller-cab small{color:var(--tinta2);font-size:var(--t-etq)}
.modelos-base{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.modelos-base .opc{flex:none}
.taller-visor{position:relative;aspect-ratio:4/3;overflow:hidden;background:radial-gradient(100% 80% at 50% 30%,#FFFFFF,var(--papel) 60%,#E3E2D9);touch-action:none;border-radius:50% 50% 0 0/26% 26% 0 0}
.taller-visor canvas{width:100%!important;height:100%!important;display:block}
.taller-visor .cargando,.v3d .cargando{position:absolute;inset:0;display:grid;place-items:center;color:var(--tinta2);font-size:var(--t-ui);padding:20px;text-align:center}
.taller-grabado{margin-top:12px}
.taller-grabado input[type=text]{width:100%;border:0;border-bottom:1.5px solid var(--linea2);padding:10px 0;background:transparent;color:var(--tinta);font-size:22px}
.taller-grabado input[type=text]:focus{outline:none;border-color:var(--esmeralda)}
.check{display:flex;gap:12px;align-items:center;cursor:pointer;padding:9px 0;font-size:var(--t-ui)}
.check input,.consent input{width:18px;height:18px;accent-color:var(--esmeralda);flex:none}
.sub-grabado{display:block;font-size:var(--t-meta);color:var(--tinta2);margin:16px 0 8px}
.subir{position:relative;display:block;padding:22px;text-align:center;font-weight:400;color:var(--tinta2);font-size:var(--t-ui);cursor:pointer;background:var(--papel);
  background-image:linear-gradient(90deg,var(--linea2) 50%,transparent 0),linear-gradient(90deg,var(--linea2) 50%,transparent 0),linear-gradient(0deg,var(--linea2) 50%,transparent 0),linear-gradient(0deg,var(--linea2) 50%,transparent 0);
  background-size:10px 1.5px,10px 1.5px,1.5px 10px,1.5px 10px;background-position:0 0,0 100%,0 0,100% 0;background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;transition:background-color .2s}
.subir:hover,.subir.encima{background-color:#fff}
.subir svg{width:30px;height:30px;stroke:var(--esmeralda);fill:none;stroke-width:1.4;display:block;margin:0 auto 8px}
.subir b{color:var(--tinta);font-weight:600}
.subir input{position:absolute;inset:0;opacity:0;cursor:pointer}
.previas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.previas div{position:relative;width:72px;height:72px;overflow:hidden;border-radius:50% 50% 0 0/30% 30% 0 0}
.previas img{width:100%;height:100%;object-fit:cover}
.previas button{all:unset;cursor:pointer;position:absolute;top:auto;bottom:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(19,38,31,.8);color:#fff;text-align:center;line-height:21px;font-size:15px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:var(--t-meta);color:var(--tinta2);margin:18px 0;cursor:pointer;line-height:1.45}
.error-form{color:#9B1C2C;font-size:var(--t-ui);font-weight:500;margin:0 0 12px}
.error-form:empty{display:none}
.enviar{width:100%;min-height:56px;font-size:16px}
.enviar[disabled]{opacity:.65;cursor:wait}
.exito{text-align:center;padding:30px 10px}
.exito .check-oro{width:84px;height:84px;margin:0 auto 22px;display:grid;place-items:center;background:var(--esmeralda);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.exito .check-oro svg{width:38px;height:38px;stroke:var(--nacar);fill:none;stroke-width:2.4;stroke-dasharray:40;stroke-dashoffset:40;animation:traza .6s .35s forwards}
.exito h3{font-size:34px;margin-bottom:10px}
.exito p{color:var(--tinta2);margin:0 0 24px}
@keyframes pop{from{transform:scale(0) rotate(-45deg)}to{transform:none}}
@keyframes traza{to{stroke-dashoffset:0}}
.est-letras{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px}
.est-letras .opc{display:block}
.est-letras .opc > span{display:block;text-align:center;padding:8px}
.est-letras b{display:block;font-size:17px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.est-letras small{display:block;font-size:12px;line-height:1.25;margin:2px 0 0}
.est-tamanos{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.est-tamanos i{font-style:normal;font-family:var(--serif)}

/* ---------- Ilustraciones de línea ---------- */
.ilus{width:100%;height:auto;color:var(--esmeralda);display:block}
.ilus [pathLength]{stroke-dasharray:1;stroke-dashoffset:0}
.ilus .pp{opacity:.9;color:var(--oro)}

/* ---------- Marca ---------- */
.marca-sec{position:relative;background:var(--nacar);padding:clamp(100px,14vw,200px) 0;overflow:hidden}
.marca-sec .envol{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(30px,6vw,100px);align-items:center}
.emblema{width:clamp(110px,16vw,230px);color:var(--oro);will-change:transform}
.emblema svg{width:100%;height:auto;display:block}
.frase-marca{font-family:var(--serif);font-size:clamp(34px,5.2vw,84px);line-height:1.06;letter-spacing:-.015em;margin:0;max-width:18ch}
.frase-marca .pal{opacity:var(--o,.16);transition:opacity .25s}
.firma-marca{margin:26px 0 0;color:var(--tinta2);font-size:var(--t-ui)}

/* ---------- Proceso ---------- */
.proceso{background:var(--papel)}
.ruta{list-style:none;margin:0;padding:0;position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.ruta::before{content:'';position:absolute;left:0;right:0;top:27px;height:1.5px;background:var(--linea2)}
.ruta::after{content:'';position:absolute;left:0;right:0;top:27px;height:1.5px;background:var(--esmeralda);transform-origin:left;transform:scaleX(var(--avance,0))}
.etapa{position:relative;padding:0 18px 0 0}
.etapa-n{position:relative;z-index:1;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--papel);box-shadow:inset 0 0 0 1.5px var(--linea2);font-family:var(--serif);font-size:22px;margin-bottom:22px;transition:background-color .4s,color .4s,box-shadow .4s}
.etapa.hecha .etapa-n{background:var(--esmeralda);color:var(--nacar);box-shadow:inset 0 0 0 1.5px var(--esmeralda),0 0 0 4px var(--papel),0 0 0 5.5px var(--oro)}
.etapa-il{width:74px;margin-bottom:12px}
.etapa h3{font-size:clamp(22px,2vw,28px);margin:0 0 6px}
.etapa p{margin:0;font-size:var(--t-meta);color:var(--tinta2);max-width:22ch}

/* ---------- Pie ---------- */
.pie2{background:var(--noche);color:var(--nacar);padding:clamp(70px,9vw,120px) 0 40px}
.pie2 .envol{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px 60px}
.pie-grande{font-family:var(--serif);font-size:clamp(44px,7vw,120px);line-height:.95;letter-spacing:-.02em;margin:0 0 28px}
.pie2 .logo{margin:0 0 18px}
.pie2 .logo svg{width:34px}
.pie-nav{display:grid;gap:8px;align-content:start}
.pie-nav a{font-family:var(--serif);font-size:clamp(24px,2.4vw,34px);text-decoration:none;color:var(--nacar);width:max-content;background:linear-gradient(var(--oro-claro),var(--oro-claro)) 0 100%/0 1px no-repeat;transition:background-size .4s var(--curva)}
.pie-nav a:hover{background-size:100% 1px}
.pie2 .legal{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid rgba(236,235,227,.18);padding-top:22px;margin:30px 0 0;color:rgba(236,235,227,.62);font-size:var(--t-meta)}
.pie2 .btn-oro{background:var(--nacar);color:var(--noche)}

/* ---------- Ficha de la joya ---------- */
.ficha-capa{position:fixed;inset:0;z-index:60;background:var(--nacar);overflow-y:auto;overscroll-behavior:contain;animation:sube .55s var(--curva)}
.ficha-top{position:sticky;top:0;z-index:5;background:var(--vidrio);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--linea)}
.ficha-top .envol{display:flex;align-items:center;gap:16px;height:64px}
.volver{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-size:var(--t-ui);font-weight:500;margin-right:auto}
.volver svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .3s}
.volver:hover svg{transform:translateX(-4px)}
.volver:focus-visible{outline:2px solid var(--esmeralda);outline-offset:3px}
.ficha{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);grid-template-areas:"gal cab" "gal info";column-gap:clamp(30px,5vw,80px);row-gap:18px;padding:32px 0 100px;align-items:start}
.ficha > div{min-width:0}
.ficha-cab{grid-area:cab;padding-top:8px}
.ficha h1{font-size:clamp(38px,4.4vw,68px);margin:0}
.h1-piedra{display:block;font-size:.5em;margin-top:10px;color:var(--esmeralda);letter-spacing:0}
.ficha .galeria{grid-area:gal;position:sticky;top:84px;align-self:start;min-width:0}
.ficha-info{grid-area:info;min-width:0;display:flex;flex-direction:column}
.lupa{position:relative;aspect-ratio:1;overflow:hidden;background:radial-gradient(100% 80% at 50% 30%,#FFFFFF,var(--papel) 60%,#E3E2D9);cursor:zoom-in;border-radius:50% 50% 0 0/34% 34% 0 0}
.lupa img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease,opacity .35s}
.lupa.zoom img{transform:scale(2.1)}
.lupa video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.lupa.modo-video,.lupa.modo-3d{cursor:default}
.lupa.modo-3d{cursor:grab}.lupa.modo-3d:active{cursor:grabbing}
.v3d{position:absolute;inset:0}
.ctrl3d{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:6px;z-index:2}
.ctrl3d button{all:unset;cursor:pointer;font-size:var(--t-etq);font-weight:600;background:rgba(247,246,241,.88);color:var(--tinta);padding:8px 13px;backdrop-filter:blur(6px);white-space:nowrap;
  clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px)}
.ctrl3d button:hover{background:var(--tinta);color:var(--nacar)}
.ctrl3d button:focus-visible{background:var(--esmeralda);color:var(--nacar)}
.pista-3d{position:absolute;top:22%;left:50%;transform:translateX(-50%);z-index:2;font-size:var(--t-etq);color:var(--tinta2);white-space:nowrap;pointer-events:none;transition:opacity .6s}
.pista-3d.fuera{opacity:0}
.taller-visor .pista-3d{top:24%}.taller-visor .ctrl3d{bottom:10px}

.c3-grab{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 13px;font-size:var(--t-meta);color:var(--esmeralda);font-weight:600;
  background:linear-gradient(90deg,currentColor 50%,transparent 0) 0 0/8px 1.5px repeat-x,linear-gradient(90deg,currentColor 50%,transparent 0) 0 100%/8px 1.5px repeat-x,linear-gradient(0deg,currentColor 50%,transparent 0) 0 0/1.5px 8px repeat-y,linear-gradient(0deg,currentColor 50%,transparent 0) 100% 0/1.5px 8px repeat-y}
.c3-grab.activo{background:var(--tinta);color:var(--nacar)}
.c3-grab small{font-weight:400;opacity:.75;font-size:var(--t-etq)}
.c3-grab:focus-visible{outline:2px solid var(--esmeralda);outline-offset:2px}
.c3-quitar{all:unset;cursor:pointer;font-size:var(--t-meta);color:var(--tinta2);text-decoration:underline;text-underline-offset:3px;padding:9px 6px}

.c3-link{all:unset;cursor:pointer;font-size:var(--t-meta);font-weight:600;color:var(--esmeralda);text-decoration:underline;text-underline-offset:4px}
.c3-link:focus-visible{outline:2px solid var(--esmeralda);outline-offset:2px}
.guia-talla{margin-top:10px;padding:14px 16px;background:var(--papel);font-size:var(--t-meta);line-height:1.5;color:var(--tinta2);box-shadow:inset 3px 0 0 var(--oro)}

.estudio{margin:6px 0 10px;padding:18px;background:var(--papel);box-shadow:inset 0 0 0 1px var(--linea);animation:sube .45s var(--curva);min-width:0;max-width:100%}

.est-listo:focus-visible{background:var(--esmeralda)}
#eTexto{width:100%;border:0;border-bottom:1.5px solid var(--linea2);padding:10px 0;background:transparent;color:var(--tinta);font-size:24px}
#eTexto:focus{outline:none;border-color:var(--esmeralda)}
.est-info{display:flex;justify-content:space-between;margin:8px 0 12px;color:var(--tinta2);font-size:var(--t-meta)}

.vista-grabado{margin-top:12px;height:64px;border-radius:999px;background:linear-gradient(180deg,#F4D98E,#C49022 55%,#8A6414);display:grid;place-items:center;color:rgba(70,48,10,.85);font-size:20px;letter-spacing:.06em;text-shadow:0 1px 0 rgba(255,240,200,.6);box-shadow:inset 0 2px 6px rgba(0,0,0,.25);overflow:hidden;white-space:nowrap;padding:0 24px}
.total{position:sticky;bottom:0;margin-top:20px;padding:18px 0;background:var(--nacar);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;z-index:3;box-shadow:0 -1px 0 var(--linea2)}
.total .t-precio span{display:block;color:var(--tinta2);font-size:var(--t-meta)}

.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border-top:1px solid var(--linea2)}
.specs span{display:flex;flex-direction:column;padding:12px 12px 12px 0;font-size:var(--t-etq);color:var(--tinta2);border-bottom:1px solid var(--linea2)}

/* ---------- Perfil ---------- */
dialog.dlg-perfil{border:0;padding:0;width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--nacar);color:var(--tinta);box-shadow:0 40px 90px rgba(12,43,35,.35)}
dialog.dlg-perfil::backdrop{background:rgba(12,43,35,.6);backdrop-filter:blur(4px)}
.dlg-perfil form{padding:clamp(22px,4vw,36px);position:relative}
.dlg-perfil h3{font-size:34px;margin:0 0 8px}
.dlg-perfil .sub{color:var(--tinta2);font-size:var(--t-ui);margin:0 0 22px}
.dlg-perfil .aviso-pedido{background:var(--papel);box-shadow:inset 3px 0 0 var(--esmeralda);padding:12px 14px;font-size:var(--t-ui);margin:0 0 18px}

.cerrar-p{all:unset;cursor:pointer;position:absolute;top:14px;right:14px;width:40px;height:40px;display:grid;place-items:center;color:var(--tinta2);font-size:26px}
.cerrar-p:focus-visible{outline:2px solid var(--esmeralda)}

/* ---------- Visor de fotos ---------- */
.visor{position:fixed;inset:0;z-index:90;background:var(--noche);display:flex;align-items:center;justify-content:center;animation:aparece .3s ease}
.lienzo{position:absolute;inset:0;display:grid;place-items:center;touch-action:none;overflow:hidden;cursor:zoom-in}
.lienzo.acercado{cursor:grab}
.lienzo img{max-width:min(92vw,1100px);max-height:84vh;object-fit:contain;background:#fff;transform-origin:center;transition:transform .25s ease;user-select:none;-webkit-user-drag:none}
.lienzo.arrastrando img{transition:none}
.cerrar-v,.nav-v{all:unset;cursor:pointer;position:absolute;z-index:2;width:48px;height:48px;display:grid;place-items:center;background:rgba(236,235,227,.12);color:var(--nacar);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.cerrar-v:hover,.nav-v:hover,.cerrar-v:focus-visible,.nav-v:focus-visible{background:var(--nacar);color:var(--noche)}
.cerrar-v{top:max(16px,env(safe-area-inset-top));right:16px;font-size:26px}
.nav-v svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-v.izq{left:16px;top:50%;margin-top:-24px}.nav-v.der{right:16px;top:50%;margin-top:-24px}
.pie-visor{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;color:rgba(236,235,227,.7);font-size:var(--t-meta);z-index:2;pointer-events:none}
.pie-visor b{color:var(--oro-claro);font-weight:600;margin-right:10px}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes sube{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

    if (xh.fotosPrestadas && !VH && VHcargar) VHcargar();

  $$('#vitrina input[name=vhColor]').forEach(r => r.onchange = () => { VHestado.color = +r.value; actualizar(); });

    }).catch(() => { delete cont.dataset.cargando; });

function montarSecuencias() {
  SEQS.forEach(s => s.imgs.forEach(im => { if (im) im.src = ''; }));
  SEQS = [];
  if (obsSeq) obsSeq.disconnect();
  obsSeq = new IntersectionObserver(es => es.forEach(e => { const s = SEQS.find(x => x.sec === e.target); if (s && e.isIntersecting) cargarCuadros(s); }), { rootMargin: '150% 0px' });

    const s = { sec, nombre: sec.dataset.seq, n: +sec.dataset.cuadros || 100, lienzo: sec.querySelector('.seq-lienzo'), imgs: [], listo: [], dibujado: -1, cargando: false,
      pasos: [...sec.querySelectorAll('.seq-paso')], lista: [...sec.querySelectorAll('[data-desde]')], p: 0 };
    s.ctx = s.lienzo.getContext('2d');
    if (sinMovimiento) sec.classList.add('estatico');
    SEQS.push(s); obsSeq.observe(sec);
  });
  medirLienzos();

    else if (tipo === 'cinta') el.firstElementChild.style.transform = `translate3d(${(-p * 50).toFixed(2)}%,0,0)`;

    }

}

/* ---------- Efectos: aparición, inclinación, paralaje, luz ---------- */
let observador = null;
function activarEfectos(raiz = document) {
  if (!observador) observador = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visto');
      e.target.querySelectorAll?.('[data-cuenta]').forEach(contar);
      observador.unobserve(e.target);
    }
  }), { threshold: .14, rootMargin: '0px 0px -40px 0px' });
  raiz.querySelectorAll('[data-rev]:not(.visto)').forEach(el => sinMovimiento ? el.classList.add('visto') : observador.observe(el));
  raiz.querySelectorAll('.valores,.pasos').forEach(el => observador.observe(el.closest('[data-rev]') || el));
  if (conPuntero && !sinMovimiento) raiz.querySelectorAll('[data-tilt]').forEach(inclinar);
  raiz.querySelectorAll('[data-carrusel]').forEach(carrusel);
  if (conPuntero && !sinMovimiento) raiz.querySelectorAll('[data-video]').forEach(c => {
    if (c._vid) return; c._vid = true; const v = c.querySelector('video.prev'); if (!v) return;
    c.addEventListener('mouseenter', () => { v.play().then(() => c.classList.add('reproduciendo')).catch(() => {}); });
    c.addEventListener('mouseleave', () => { c.classList.remove('reproduciendo'); v.pause(); });
  });
  raiz.querySelectorAll('[data-giro]').forEach(giro);
}
function carrusel(card) {
  if (card._car) return; card._car = true;
  const imgs = [...card.querySelectorAll('.slides img')], puntos = [...card.querySelectorAll('.puntos i')];
  let i = 0, t = null;
  const ir = k => { i = (k + imgs.length) % imgs.length; imgs.forEach((im, n) => im.classList.toggle('activa', n === i)); puntos.forEach((p, n) => p.classList.toggle('activa', n === i)); };
  const auto = () => { clearInterval(t); if (!sinMovimiento) t = setInterval(() => ir(i + 1), 3200); };
  card.addEventListener('click', e => {
    const d = e.target.closest('[data-dir]'), p = e.target.closest('[data-ir]');
    if (d || p) { e.preventDefault(); e.stopPropagation(); ir(d ? i + +d.dataset.dir : +p.dataset.ir); auto(); }
  });
  let x0 = null;
  card.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  card.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) { ir(i + (dx < 0 ? 1 : -1)); auto(); card._arrastro = true; setTimeout(() => card._arrastro = false, 50); } x0 = null; });
  card.addEventListener('click', e => { if (card._arrastro) e.preventDefault(); }, true);
  new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? auto() : clearInterval(t)), { threshold: .3 }).observe(card);
}
function giro(card) {
  if (card._giro) return; card._giro = true;
  const zona = card.querySelector('.foto'), imgs = [...zona.querySelectorAll('img')], barra = zona.querySelector('.barra-giro i');
  const mostrar = x => { const k = Math.min(imgs.length - 1, Math.max(0, Math.floor(x * imgs.length))); imgs.forEach((im, n) => im.classList.toggle('activa', n === k)); barra.style.width = ((k + 1) / imgs.length * 100) + '%'; };
  zona.addEventListener('mousemove', e => { const r = zona.getBoundingClientRect(); mostrar((e.clientX - r.left) / r.width); });
  zona.addEventListener('mouseleave', () => mostrar(0));
  let movio = false;
  zona.addEventListener('touchmove', e => { const r = zona.getBoundingClientRect(); mostrar((e.touches[0].clientX - r.left) / r.width); movio = true; }, { passive: true });
  zona.addEventListener('touchend', () => { setTimeout(() => movio = false, 60); });

function contar(el) {
  const fin = +el.dataset.cuenta, t0 = performance.now();
  const paso = t => { const k = Math.min(1, (t - t0) / 1200); el.textContent = Math.round(fin * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(paso); };
  sinMovimiento ? (el.textContent = fin) : requestAnimationFrame(paso);
}
function inclinar(el) {

  el.addEventListener('mousemove', e => {
    const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    el.style.transform = `perspective(1000px) rotateX(${(0.5 - y) * 7}deg) rotateY(${(x - 0.5) * 9}deg) translateY(-4px)`;
    el.style.setProperty('--sx', x * 100 + '%'); el.style.setProperty('--sy', y * 100 + '%');

      // diamante y circón: facetas oscuras y claras que alternan, con un toque de "fuego" de colores
      matP.color.setHex(0xDDE4EA).convertSRGBToLinear(); matP.emissive.setHex(0x0C0F12); matP.envMapIntensity = 4.4; matP.iridescence = g.fuego * 0.7;
      matP2.color.setHex(0xF4F7FA).convertSRGBToLinear(); matP2.emissive.setHex(0x0A0C0E); matP2.opacity = 0.8; matP2.envMapIntensity = 4.6; matP2.roughness = 0; matP2.iridescence = g.fuego * 0.45;
    } else {

      matP.color.setHex(g.color).convertSRGBToLinear(); matP.emissive.setHex(g.profundo).convertSRGBToLinear().multiplyScalar(0.7); matP.envMapIntensity = 3.4; matP.iridescence = 0;
      matP2.color.setHex(g.color).convertSRGBToLinear(); matP2.emissive.setHex(g.profundo).convertSRGBToLinear().multiplyScalar(0.4); matP2.opacity = 0.84; matP2.envMapIntensity = 3.6; matP2.roughness = 0; matP2.iridescence = 0;
    }
    matP.needsUpdate = true; matP2.needsUpdate = true;
  }
  const r = caja.getBoundingSphere(new THREE.Sphere()).radius || 1;
  const camara = new THREE.PerspectiveCamera(32, ancho() / alto(), r / 100, r * 100);
  const inicio = () => { camara.position.set(r * 2.2, r * 1.4, r * 3.0); camara.lookAt(0, 0, 0); };
  inicio();
  const ctr = new THREE.OrbitControls(camara, renderer.domElement);
  ctr.enableDamping = true; ctr.dampingFactor = 0.08; ctr.autoRotate = true; ctr.autoRotateSpeed = 1.8; ctr.enablePan = false;
  if (opc.zoom === false) ctr.enableZoom = false;                       // en el banner la rueda debe seguir bajando la página
  if (opc.tactil) renderer.domElement.style.touchAction = 'pan-y';     // y en el celular el dedo puede seguir deslizando hacia abajo
  ctr.minDistance = r * 0.9; ctr.maxDistance = r * 7;
  ctr.addEventListener('start', () => { ctr.autoRotate = false; anim = null; cont.dispatchEvent(new CustomEvent('giro-manual')); });
  // ----- Grabado láser dentro del aro -----
  const aro = medirAro(geo);
  let grabadoMalla = null, anim = null;
  const vec = k => new THREE.Vector3(k === 0 ? 1 : 0, k === 1 ? 1 : 0, k === 2 ? 1 : 0);
  const FUENTE_3D = "italic 500 {t}px 'Bodoni Moda', Didot, 'Times New Roman', serif";
  const fuenteCanvas = (f, t) => (f || FUENTE_3D).replace('{t}', t);
  function textura(texto, alturaMundo, arco, fuente) {
    const H = 160, W = Math.min(4096, Math.max(256, Math.round(H * arco / alturaMundo)));
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const x = cv.getContext('2d');
    let tam = H * 0.62; x.font = fuenteCanvas(fuente, tam);
    while (x.measureText(texto).width > W * 0.94 && tam > 20) { tam -= 4; x.font = fuenteCanvas(fuente, tam); }
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = 'rgba(255,240,200,.55)'; x.fillText(texto, W / 2 + 2, H / 2 + 2);   // brillo del borde tallado
    x.fillStyle = 'rgba(58,36,6,.95)'; x.fillText(texto, W / 2, H / 2);                 // fondo del surco
    const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, -1);  // se lee bien desde adentro del aro
    return t;
  }
  function grabar(texto, opc = {}) {
    if (grabadoMalla) { malla.remove(grabadoMalla); grabadoMalla.geometry.dispose(); grabadoMalla.material.map.dispose(); grabadoMalla.material.dispose(); grabadoMalla = null; }
    texto = String(texto || '').trim(); if (!texto || !aro) return !!aro;
    const alturaT = aro.ancho * (opc.escala || 0.58);
    const med = document.createElement('canvas').getContext('2d'); med.font = fuenteCanvas(opc.fuente, 100);
    const proporcion = med.measureText(texto).width / 100 * 0.62;                       // ancho del texto frente a su altura
    const arco = Math.max(alturaT * 2, alturaT * proporcion + alturaT * 0.9);
    const span = Math.min(Math.PI * 1.15, arco / aro.Ri);
    const g = new THREE.CylinderGeometry(aro.Ri * 0.992, aro.Ri * 0.992, alturaT, 96, 1, true, -span / 2, span);
    const m = new THREE.MeshStandardMaterial({ map: textura(texto, alturaT, span * aro.Ri, opc.fuente), transparent: true, metalness: 0.7, roughness: 0.45, side: THREE.BackSide, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
    grabadoMalla = new THREE.Mesh(g, m);
    const Y = vec(aro.eje), Z = vec(aro.arriba).multiplyScalar(-1), X = new THREE.Vector3().crossVectors(Y, Z);
    grabadoMalla.matrix.makeBasis(X, Y, Z);
    const pos = new THREE.Vector3(); pos.setComponent(aro.eje, aro.ca); pos.setComponent(aro.lado, aro.cu); pos.setComponent(aro.arriba, aro.cv);
    grabadoMalla.matrix.setPosition(pos); grabadoMalla.matrixAutoUpdate = false;
    malla.add(grabadoMalla);
    return true;
  }
  function mirarGrabado() {
    if (!aro) return;
    malla.updateMatrixWorld();
    const centro = new THREE.Vector3(); centro.setComponent(aro.eje, aro.ca); centro.setComponent(aro.lado, aro.cu); centro.setComponent(aro.arriba, aro.cv);
    const c = malla.localToWorld(centro.clone());
    const dirEje = vec(aro.eje).applyQuaternion(malla.quaternion), dirArriba = vec(aro.arriba).applyQuaternion(malla.quaternion);
    const destino = c.clone().add(dirEje.multiplyScalar(aro.Ri * 3.1)).add(dirArriba.multiplyScalar(aro.Ri * 1.35));
    ctr.autoRotate = false;
    anim = { desde: camara.position.clone(), hasta: destino, tDesde: ctr.target.clone(), tHasta: c.clone().add(vec(aro.arriba).applyQuaternion(malla.quaternion).multiplyScalar(-aro.Ri * 0.45)), t0: performance.now() };
  }
  let vivo = true, pausado = false;
  const bucle = () => {
    if (!vivo) return;
    if (pausado) { requestAnimationFrame(bucle); return; }
    if (anim) {
      const k = Math.min(1, (performance.now() - anim.t0) / 900), e = 1 - Math.pow(1 - k, 3);
      camara.position.lerpVectors(anim.desde, anim.hasta, e); ctr.target.lerpVectors(anim.tDesde, anim.tHasta, e);
      if (k === 1) anim = null;
    }
    ctr.update(); renderer.render(escena, camara); requestAnimationFrame(bucle);
  };
  bucle();
  const ro = new ResizeObserver(() => { const W = ancho(), H = alto(); if (!W || !H) return; renderer.setSize(W, H, false); camara.aspect = W / H; camara.updateProjectionMatrix(); });
  ro.observe(cont);
  return {
    color: m => pintarMetal(m),
    colorPiedra: n => pintarPiedra(n),
    tienePiedras: () => !!matP,
    tieneFijas: () => !!matF,
    girar: si => { ctr.autoRotate = si; },
    girando: () => ctr.autoRotate,
    pausar: si => { pausado = !!si; },
    reiniciar: () => { anim = null; inicio(); ctr.target.set(0, 0, 0); ctr.autoRotate = true; ctr.update(); },
    puedeGrabar: () => !!aro,
    grabado: (texto, opc) => grabar(texto, opc),
    mirarGrabado,
    destruir: () => { vivo = false; grabar(''); ro.disconnect(); ctr.dispose(); pm.dispose(); renderer.dispose(); geo.dispose(); mat.dispose(); if (geoP) geoP.dispose(); if (matP) matP.dispose(); if (matP2) matP2.dispose(); if (geoF) geoF.dispose(); if (matF) matF.dispose(); if (matF2) matF2.dispose(); if (envPiedras) envPiedras.dispose(); renderer.domElement.remove(); }
  };
}

/* ---------- Visor de fotos a pantalla completa ---------- */
const V = { fotos: [], i: 0, s: 1, x: 0, y: 0, punteros: new Map(), d0: 0, s0: 1, ultimoToque: 0, movido: false, origen: null };
function abrirVisor(fotos, i) {
  if (!fotos || !fotos.length) return;
  V.fotos = fotos; V.i = i || 0;
  let v = $('#visor');
  if (!v) {
    v = document.createElement('div'); v.id = 'visor'; v.className = 'visor';
    v.setAttribute('role', 'dialog'); v.setAttribute('aria-modal', 'true'); v.setAttribute('aria-label', 'Foto ampliada');
    v.innerHTML = `<div class="lienzo" id="lienzo"><img id="visorImg" alt="" draggable="false"></div>
      <button class="cerrar-v" id="cerrarV" aria-label="Cerrar">×</button>
      <button class="nav-v izq" id="antV" aria-label="Foto anterior"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="nav-v der" id="sigV" aria-label="Foto siguiente"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <p class="pie-visor"><b id="contV"></b>${conPuntero ? 'Rueda o doble clic para acercar. Arrastra para mover.' : 'Pellizca o toca dos veces para acercar. Desliza para cambiar.'}</p>`;
    document.body.appendChild(v);
    $('#cerrarV').onclick = cerrarVisor;
    $('#antV').onclick = () => irVisor(-1);
    $('#sigV').onclick = () => irVisor(1);
    montarGestos($('#lienzo'));
  }
  v.hidden = false; mostrarVisor(); $('#cerrarV').focus();
}
function cerrarVisor() { const v = $('#visor'); if (v) v.hidden = true; const b = $('#btnAmpliar'); if (b) b.focus(); }
function irVisor(d) { V.i = (V.i + d + V.fotos.length) % V.fotos.length; mostrarVisor(); }
function mostrarVisor() {
  V.s = 1; V.x = 0; V.y = 0; aplicarVisor();
  $('#visorImg').src = V.fotos[V.i];
  $('#contV').textContent = V.fotos.length > 1 ? `${V.i + 1} / ${V.fotos.length}` : '';
  $('#antV').hidden = $('#sigV').hidden = V.fotos.length < 2;
}
function aplicarVisor() {
  const img = $('#visorImg'); if (!img) return;
  if (V.s <= 1.01) { V.s = 1; V.x = 0; V.y = 0; }
  else { const w = img.offsetWidth, h = img.offsetHeight; const mx = (w * V.s - w) / 2 + 40, my = (h * V.s - h) / 2 + 40; V.x = Math.max(-mx, Math.min(mx, V.x)); V.y = Math.max(-my, Math.min(my, V.y)); }
  img.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.s})`;
  $('#lienzo').classList.toggle('acercado', V.s > 1);
}
function zoomEn(px, py, nueva) {
  const img = $('#visorImg'), r = img.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2, k = nueva / V.s;
  V.x += (px - cx) * (1 - k); V.y += (py - cy) * (1 - k); V.s = nueva; aplicarVisor();
}
function montarGestos(l) {
  l.addEventListener('pointerdown', e => {
    l.setPointerCapture(e.pointerId); V.punteros.set(e.pointerId, { x: e.clientX, y: e.clientY }); V.movido = false;
    V.origen = { x: e.clientX, y: e.clientY, tx: V.x, ty: V.y };
    if (V.punteros.size === 2) { const [a, b] = [...V.punteros.values()]; V.d0 = Math.hypot(a.x - b.x, a.y - b.y); V.s0 = V.s; }
    l.classList.add('arrastrando');
  });
  l.addEventListener('pointermove', e => {
    if (!V.punteros.has(e.pointerId)) return;
    V.punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (V.punteros.size === 2) {
      const [a, b] = [...V.punteros.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      V.s = Math.max(1, Math.min(4, V.s0 * d / V.d0)); V.movido = true; aplicarVisor(); return;
    }
    const dx = e.clientX - V.origen.x, dy = e.clientY - V.origen.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) V.movido = true;
    if (V.s > 1) { V.x = V.origen.tx + dx; V.y = V.origen.ty + dy; aplicarVisor(); }
  });

    if (!V.punteros.has(e.pointerId)) return;

    V.punteros.delete(e.pointerId); l.classList.remove('arrastrando');
    if (V.punteros.size) return;
    if (V.s === 1 && Math.abs(dx) > 60 && V.fotos.length > 1) { irVisor(dx < 0 ? 1 : -1); return; }
    if (!V.movido) {
      const ahora = Date.now();
      if (ahora - V.ultimoToque < 320) { zoomEn(e.clientX, e.clientY, V.s > 1 ? 1 : 2.5); V.ultimoToque = 0; }
      else { V.ultimoToque = ahora; const fuera = document.elementFromPoint(e.clientX, e.clientY) !== $('#visorImg'); if (fuera && V.s === 1) setTimeout(() => { if (V.ultimoToque === ahora) cerrarVisor(); }, 330); }
    }
  };
  l.addEventListener('pointerup', fin); l.addEventListener('pointercancel', fin);
  l.addEventListener('wheel', e => { e.preventDefault(); zoomEn(e.clientX, e.clientY, Math.max(1, Math.min(4, V.s * (e.deltaY < 0 ? 1.2 : 1 / 1.2)))); }, { passive: false });
}
addEventListener('keydown', e => {
  const v = $('#visor'); if (!v || v.hidden) return;
  if (e.key === 'Escape') { e.stopImmediatePropagation(); cerrarVisor(); }
  if (e.key === 'ArrowRight') irVisor(1);
  if (e.key === 'ArrowLeft') irVisor(-1);
}, true);

cargar();
